name: Agent Bootstrap

on:
  push:
    branches:
      - 'arena/8a5fd688-sketchware-pro'
      - 'ci/agent-bootstrap'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Recover LFS payload, dump jar API, verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1

      - name: Collect LFS payloads as plain git blobs
        run: |
          set -euo pipefail
          mkdir -p lfs_payload
          : > lfs_payload/MANIFEST.txt
          i=0
          while IFS= read -r f; do
            i=$((i+1))
            if [ -f "$f" ]; then
              sz=$(stat -c%s "$f")
              out="lfs_payload/$(printf '%02d' "$i")_$(basename "$f" | tr -c 'A-Za-z0-9._-' '_').bin"
              cp "$f" "$out"
              printf '%s\t%s\t%s\n' "$out" "$f" "$sz" >> lfs_payload/MANIFEST.txt
            fi
          done < <(git lfs ls-files -n)
          echo "collected $(wc -l < lfs_payload/MANIFEST.txt) files"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Dump public API of jar-only classes
        run: |
          set -euo pipefail
          mkdir -p lfs_payload/api
          for jar in app/libs/a.a.a-important-classes.jar \
                     app/libs/a.a.a-notimportant-classes.jar \
                     app/libs/com.besome.sketch-classes.jar; do
            base=$(basename "$jar" .jar)
            out="lfs_payload/api/${base}.txt"
            {
              echo "# javap -public for $jar"
              classes=$(unzip -Z1 "$jar" | grep '\.class$' | sed 's|\.class$||; s|/|.|g' | grep -v '\$[0-9]')
              for c in $classes; do
                echo
                echo "########## $c"
                javap -classpath "$jar" -public "$c" 2>/dev/null || echo "  <javap failed>"
              done
            } > "$out"
            echo "$base: $(grep -c '##########' "$out") classes"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK (capture log)
        id: build
        continue-on-error: true
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build_log.txt 2>&1
          echo "exit=$?" >> build_log.txt
          tail -60 build_log.txt

      - name: Publish payload, API dump and build log
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lfs_payload
          cp build_log.txt lfs_payload/build_log.txt 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f lfs_payload
          git diff --cached --quiet || git commit -m "chore: publish LFS payload, jar API dump and build log"
          git push --force origin HEAD:refs/heads/lfs-payload

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-bootstrap-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
