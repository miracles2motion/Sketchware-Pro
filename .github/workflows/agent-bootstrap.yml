name: Agent Bootstrap

on:
  workflow_dispatch:

concurrency:
  group: agent-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    name: Recover LFS payload, dump APIs, verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1

      - name: Collect LFS payloads as plain git blobs
        run: |
          set -euo pipefail
          mkdir -p lfs_payload
          : > lfs_payload/MANIFEST.txt
          i=0
          while IFS= read -r f; do
            i=$((i+1))
            if [ -f "$f" ]; then
              sz=$(stat -c%s "$f")
              out="lfs_payload/$(printf '%02d' "$i")_$(basename "$f" | tr -c 'A-Za-z0-9._-' '_').bin"
              cp "$f" "$out"
              printf '%s\t%s\t%s\n' "$out" "$f" "$sz" >> lfs_payload/MANIFEST.txt
            fi
          done < <(git lfs ls-files -n)
          echo "collected $(wc -l < lfs_payload/MANIFEST.txt) files"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK (capture log)
        id: build
        continue-on-error: true
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build_log.txt 2>&1
          code=$?
          echo "exit=$code" >> build_log.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          grep -E "BUILD (SUCCESSFUL|FAILED)|error:|What went wrong" build_log.txt | head -30
          tail -20 build_log.txt

      - name: Dump API of jar-only classes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lfs_payload/api
          for jar in app/libs/a.a.a-important-classes.jar \
                     app/libs/a.a.a-notimportant-classes.jar \
                     app/libs/com.besome.sketch-classes.jar; do
            base=$(basename "$jar" .jar)
            out="lfs_payload/api/${base}.txt"
            {
              echo "# javap -public for $jar"
              classes=$(unzip -Z1 "$jar" | grep '\.class$' | sed 's|\.class$||; s|/|.|g' | grep -v '\$[0-9]')
              for c in $classes; do
                echo
                echo "########## $c"
                javap -classpath "$jar" -public "$c" 2>/dev/null || echo "  <javap failed>"
              done
            } > "$out"
            echo "$base: $(grep -c '##########' "$out") classes"
          done

      - name: Dump LiteRT-LM API and Kotlin runtime resolution
        if: always()
        run: |
          set -uo pipefail
          mkdir -p lfs_payload/api
          AAR=$(find "$HOME/.gradle/caches" -name 'litertlm-android-*.aar' 2>/dev/null | head -1)
          if [ -n "$AAR" ]; then
            echo "AAR: $AAR"
            rm -rf /tmp/litertlm && mkdir -p /tmp/litertlm
            unzip -o -q "$AAR" -d /tmp/litertlm
            echo "=== jars inside the AAR ==="
            find /tmp/litertlm -name '*.jar' -exec sh -c 'echo "  $1 ($(stat -c%s "$1") bytes)"' _ {} \;
            CLS=/tmp/litertlm/classes.jar
            if [ ! -f "$CLS" ]; then
              CLS=$(find /tmp/litertlm -name '*.jar' | head -1)
            fi
            echo "classes jar: $CLS"
            {
              echo "# javap -public for litertlm-android ($CLS)"
              for c in $(unzip -Z1 "$CLS" 2>/dev/null | grep '^com/google/ai/edge/litertlm/.*\.class$' | grep -v '\$\$' | sed 's|\.class$||; s|/|.|g'); do
                echo
                echo "########## $c"
                javap -classpath "$CLS" -public "$c" 2>/dev/null || echo "  <javap failed>"
              done
            } > lfs_payload/api/litertlm-android.txt
            echo "litertlm classes: $(grep -c '##########' lfs_payload/api/litertlm-android.txt)"
            unzip -Z1 "$AAR" | grep -E 'jni/|so$' | head -40 > lfs_payload/api/litertlm-native.txt || true
          else
            echo "litertlm AAR not found" | tee lfs_payload/api/litertlm-android.txt
          fi

      - name: Inspect Kotlin runtime resolution
        if: always()
        run: |
          set -uo pipefail
          {
            echo "=== dependencyInsight kotlin-stdlib ==="
            gradle :app:dependencyInsight --dependency kotlin-stdlib --configuration releaseRuntimeClasspath --no-daemon 2>&1 | head -60
            echo
            echo "=== dependencyInsight kotlinx-coroutines ==="
            gradle :app:dependencyInsight --dependency kotlinx-coroutines --configuration releaseRuntimeClasspath --no-daemon 2>&1 | head -60
          } > lfs_payload/api/kotlin-resolution.txt || true
          grep -E "kotlin-stdlib|coroutines" lfs_payload/api/kotlin-resolution.txt | head -20 || true

      - name: Publish payload, API dumps and build log
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lfs_payload
          cp build_log.txt lfs_payload/build_log.txt 2>/dev/null || true
          # Keep the log of every commit: the branch is force pushed, so the
          # newest log would otherwise hide an older failure.
          cp build_log.txt "lfs_payload/build_log_${GITHUB_SHA}.txt" 2>/dev/null || true
          # Never copy *.apk into lfs_payload (.gitattributes tracks *.apk via
          # Git LFS, which would consume ~140 MB of LFS quota per run). Release
          # APKs are published as GitHub Actions workflow artifacts instead.
          rm -f lfs_payload/*.apk lfs_payload/*.bin
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f lfs_payload
          git diff --cached --quiet || git commit -m "chore: publish LFS payload, API dumps and build log"
          git push --force origin HEAD:refs/heads/lfs-payload

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-bootstrap-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Report the build result
        if: always()
        env:
          EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          if [ "${EXIT_CODE}" = "0" ]; then
            echo "::notice::Release build succeeded."
          else
            echo "::error::Release build failed (exit ${EXIT_CODE}). The log is in lfs_payload/build_log_${GITHUB_SHA}.txt"
            exit 1
          fi
